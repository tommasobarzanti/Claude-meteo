name: Pubblica su GitHub Pages

# Il deploy parte solo dal branch PREDEFINITO del repo: l'ambiente github-pages
# rifiuta i deploy dagli altri branch. Se in futuro il predefinito diventa main,
# aggiorna la riga "branches".
on:
  push:
    branches: [claude/follonica-marine-weather-dashboard-vnh6rr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
