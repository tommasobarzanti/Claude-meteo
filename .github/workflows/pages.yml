name: Pubblica su GitHub Pages

# Il deploy parte solo da main, il branch predefinito del repo: l'ambiente
# github-pages rifiuta i deploy dagli altri branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test della logica
        run: npm test
      - name: Installa Chromium per le prove nel browser
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Prove nel browser
        run: npm run test:browser
      - name: Screenshot delle prove (solo se falliscono)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-prove
          path: tests/.screenshot/
          include-hidden-files: true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepara solo i file dell'app
        run: |
          mkdir _sito
          cp -r index.html sw.js manifest.webmanifest css js icons _sito/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sito
      - id: deployment
        uses: actions/deploy-pages@v4
